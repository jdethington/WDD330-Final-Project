<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@100..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <header class="divider" id="main-header"></header>

  <h1 class="divider">Movie Settings</h1>

  <main class="divider">
    <section>
      <p>Welcome to your Movie Settings! Here you can customize your movie-watching experience by selecting your
        preferred streaming services.</p>
      <div class="divider"> </div>
    </section>
    <form action="/settings/update.html" method="post" id="settings-form">
      <fieldset>
        <legend>Your Preferred Streaming Services</legend>
        <div class="form-checkbox" id="streaming">
          <input type="checkbox" id="netflix" name="streaming" value="netflix">
          <label for="netflix"><img src="https://media.movieofthenight.com/services/netflix/logo-light-theme.svg"
              alt="Netflix" class="service-logo"></label>
          <input type="checkbox" id="prime" name="streaming" value="prime">
          <label for="prime"><img src="https://media.movieofthenight.com/services/prime/logo-light-theme.svg"
              alt="Prime" class="service-logo" loading="lazy"> Amazon Prime Video</label>
        </div>
        <button type="submit" class="btn btn-save">Save Settings</button>
      </fieldset>
    </form>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>

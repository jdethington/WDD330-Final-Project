<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies | Home</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/main.js"></script>
  <!-- google fonts Roboto & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:wght@100..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <div class="hero">
    </div>

    <section class="movie-lists">
      <h2>Movies</h2>
      <ul class="movie-list">
        <li class="movie-list-card">
          <a href="/moviePage/index.html">
            <img src="images/star-wars-240.jpg" alt="Movie Title" />
          </a>
          <h3 class="movie__title">Star Wars</h3>
          <h2 class="movie__rating">PG</h2>
          <p class="movie__length">120 minutes</p>
        </li>
      </ul>
      <h1>Movie Lookup</h1>

      <input id="movieId" type="text" placeholder="Enter movie ID">

      <button id="searchBtn">
        Search
      </button>

      <div id="movieContainer"></div>
    </section>
  </main>
  <footer id="main-footer"></footer>
</body>

</html>
